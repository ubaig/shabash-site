{{ define "main" }}

{{/* Hero */}}
<section class="bg-gradient-to-br from-primary-600 to-secondary-700 text-white py-20 md:py-28">
  <div class="container mx-auto px-4 text-center max-w-3xl">
    <p class="text-primary-200 uppercase tracking-widest text-sm font-semibold mb-4">Our Story</p>
    <h1 class="text-4xl md:text-5xl font-bold mb-6 leading-tight">{{ .Title }}</h1>
    {{ with .Description }}
      <p class="text-xl text-primary-100 leading-relaxed">{{ . }}</p>
    {{ end }}
  </div>
</section>

{{/* Content */}}
<section class="py-16 md:py-24">
  <div class="container mx-auto px-4">
    <div class="max-w-2xl mx-auto">
      <div class="prose prose-lg prose-headings:text-gray-900 prose-a:text-primary-600 prose-a:no-underline hover:prose-a:underline prose-strong:text-gray-900 prose-ol:text-gray-700 prose-ul:text-gray-700 !max-w-none">
        {{ .Content }}
      </div>
    </div>
  </div>
</section>

{{/* CTA */}}
{{ if .Site.Params.cta.enable }}
  {{ partial "components/cta.html" . }}
{{ end }}

{{ end }}
