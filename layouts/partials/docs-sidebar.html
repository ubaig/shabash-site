<div class="docs-sidebar bg-white shadow-sm rounded-lg p-4 sticky top-20 mt-2">

  {{/* Section anchors — top-level ## headings only */}}
  {{ if and .TableOfContents (ne .TableOfContents "") }}
  <div class="mt-6 pt-5 border-t border-gray-100">
    <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3 px-1">Sections</h4>
    <nav class="toc-nav text-sm">
      {{ .TableOfContents }}
    </nav>
  </div>
  {{ end }}
</div>

<style>
  .toc-nav #TableOfContents > ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .toc-nav #TableOfContents > ul > li > a {
    display: block;
    padding: 6px 12px;
    border-radius: 6px;
    color: #374151;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .toc-nav #TableOfContents > ul > li > a:hover {
    background: #f9fafb;
    color: #4f46e5;
  }
  /* Hide nested ### question links */
  .toc-nav #TableOfContents > ul > li > ul {
    display: none;
  }
</style>
